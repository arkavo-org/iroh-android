name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  aar-build:
    name: Build AAR (verifies .so bundling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: aar

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AAR
        run: ./scripts/build-aar.sh

      - name: Verify .so files present in AAR
        run: |
          set -euo pipefail
          AAR=kotlin/library/build/outputs/aar/iroh-android-release.aar
          test -f "$AAR" || { echo "AAR not produced"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$AAR" | grep -q "jni/$abi/libiroh_android.so" \
              || { echo "missing libiroh_android.so for $abi"; exit 1; }
          done
          echo "all 3 ABIs present in AAR"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: iroh-android-aar
          path: kotlin/library/build/outputs/aar/iroh-android-release.aar
          if-no-files-found: error
